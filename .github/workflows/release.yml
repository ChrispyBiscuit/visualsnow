name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remove unpacked folders
        run: rm -rf dist/Visual\ Snow*
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Visual Snow Relief Kit ${{ github.ref_name }}
          body: |
            Portable zips. Unzip and run. No installer.

            - `VisualSnowReliefKit-windows-x64.zip` — Windows 10/11
            - `VisualSnowReliefKit-macos-arm64.zip` — macOS, Apple Silicon
            - `VisualSnowReliefKit-macos-x64.zip` — macOS, Intel
            - `VisualSnowReliefKit-linux-x64.zip` — Linux x64 (X11)

            Install steps per platform are in the README.
          files: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip
