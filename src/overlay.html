<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Visual Snow Relief Kit overlay</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="presets.js"></script>
<script src="noise.js"></script>
<script>
  const canvas = document.getElementById('c');
  let r = null;
  try { r = new NoiseRenderer(canvas); } catch (e) { console.error(e); }
  function apply(s) {
    if (!r) return;
    const on = s.enabled && (s.displays === 'all' || (Array.isArray(s.displays) && s.displays.includes(window.__displayId)));
    if (!on) { r.stop(); return; }
    r.setLayers(s.layers, s.globalOpacity);
    r.start(s.maxFps);
    r.maxFps = s.maxFps || 60;
  }
  window.__displayId = Number(new URLSearchParams(location.search).get('display'));
  window.vs.onDisplay((d) => { window.__displayId = d.id; });
  window.vs.onSettings(apply);
  window.vs.getSettings().then(apply);
</script>
</body>
</html>
